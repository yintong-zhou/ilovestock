[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ilovestock"
version = "0.1.0"
description = "Educational buy/no-buy screening + trade plan for US stocks. Not financial advice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance==1.7.0",
]

[project.optional-dependencies]
finviz = ["finviz==2.0.0"]
dev = ["pytest>=8", "ruff>=0.6", "ta-lib>=0.6"]

[project.scripts]
ilovestock = "ilovestock.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: hits live services (Yahoo, Finviz); run only on request"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
