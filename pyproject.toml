[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ilovestock"
version = "0.1.0"
description = "Educational buy/no-buy screening + trade plan for US stocks. Not financial advice."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2.2",
    "numpy>=1.26",
    "yfinance==1.7.0",
    "finviz==2.0.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "fpdf2>=2.8",
]

[project.urls]
Repository = "https://github.com/yintong-zhou/ilovestock"
Issues = "https://github.com/yintong-zhou/ilovestock/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "ta-lib>=0.6", "httpx>=0.27"]

[project.scripts]
ilovestock = "ilovestock.cli:app"

[tool.setuptools.package-data]
ilovestock = ["static/**/*", "logo.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: hits live services (Yahoo, Finviz); run only on request"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
